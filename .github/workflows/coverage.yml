name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Superseded PR validation must not hold runner capacity.
concurrency:
  group: pr-ci-coverage.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  forge:
    permissions:
      contents: read
    uses: SatoshiAndKin/pooltogether-v5-twab-controller/.github/workflows/coverage-reviewed-linux.yml@4a20c58f810bd60c62654a596d80bc4cd86b6a87
